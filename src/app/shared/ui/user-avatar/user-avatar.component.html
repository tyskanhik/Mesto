<div class="avatar-container">
    <div class="avatar"
        [style.background-image]="'url(' + avatarUrl + ')'"
        [style.width.px]="size"
        [style.height.px]="size">
    </div>
    
    <div class="avatar-overlay">
        <img src="/assets/images/edit-image-icon.svg" 
            class="edit-icon" 
            alt="Edit avatar">
    </div>
</div>
